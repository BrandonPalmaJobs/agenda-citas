# Baja el DENUE (INEGI, sector salud) y saca los consultorios dentales. Resultado como artefacto temporal.
name: Extraer dentistas DENUE
on:
  workflow_dispatch:
    inputs:
      clave:
        description: "Clave para cifrar el resultado"
        required: true
permissions:
  contents: write
jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          # El servidor del INEGI no manda su certificado intermedio: se baja por AIA y se agrega
          echo | openssl s_client -connect www.inegi.org.mx:443 -servername www.inegi.org.mx 2>/dev/null | openssl x509 > hoja.pem
          AIA=$(openssl x509 -in hoja.pem -noout -text | grep -o 'CA Issuers - URI:[^ ]*' | head -1 | sed 's/CA Issuers - URI://')
          echo "intermedio: $AIA"
          curl -sSL "$AIA" -o inter.bin
          (openssl x509 -inform DER -in inter.bin 2>/dev/null || openssl x509 -in inter.bin) > inter.pem
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          curl -sSL --cacert bundle.pem -A "Mozilla/5.0" -o denue.zip https://www.inegi.org.mx/contenidos/masiva/denue/denue_00_62_csv.zip
          ls -la denue.zip
          python prospeccion/extraer_dentistas.py denue.zip dentistas.csv
          gzip -9 dentistas.csv
      - name: Guardar cifrado en rama temporal
        env:
          CLAVE: ${{ inputs.clave }}
        run: |
          echo "::add-mask::$CLAVE"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in dentistas.csv.gz -out dentistas.enc -pass env:CLAVE
          mkdir salida && mv dentistas.enc salida/ && cd salida
          git init -q && git checkout -q -b tmp-datos
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add . && git commit -q -m "datos cifrados temporales"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-datos
