name: Generar voz de narracion
on:
  workflow_dispatch:
    inputs:
      texto:
        description: "Texto a narrar"
        required: true
      voz:
        default: "es-MX-DaliaNeural"
      nombre:
        default: "muestra"
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q edge-tts
      - env:
          TEXTO: ${{ inputs.texto }}
          VOZ: ${{ inputs.voz }}
          NOMBRE: ${{ inputs.nombre }}
        run: |
          mkdir salida
          edge-tts --voice "$VOZ" --rate=+5% --text "$TEXTO" --write-media "salida/$NOMBRE.mp3"
          ls -la salida
          cd salida && git init -q && git checkout -q -b voces
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m voz && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voces
