name: Generar voz de narracion
on:
  workflow_dispatch:
    inputs:
      lineas:
        description: "Una linea por audio: nombre|texto"
        required: true
      voz:
        default: "es-MX-DaliaNeural"
      velocidad:
        default: "+0%"
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q edge-tts
      - env:
          LINEAS: ${{ inputs.lineas }}
          VOZ: ${{ inputs.voz }}
          VEL: ${{ inputs.velocidad }}
        run: |
          mkdir salida
          printf '%s\n' "$LINEAS" | while IFS='|' read -r nombre texto; do
            [ -z "$nombre" ] && continue
            edge-tts --voice "$VOZ" --rate="$VEL" --text "$texto" --write-media "salida/$nombre.mp3"
          done
          ls -la salida
          cd salida && git init -q && git checkout -q -b voces
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m voz && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voces
