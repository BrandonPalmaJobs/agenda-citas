# Manda los recordatorios de WhatsApp de todas las clinicas cada 15 minutos.
# Secretos necesarios: WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID,
# REGISTRO_TURSO_URL, REGISTRO_TURSO_TOKEN.
name: Recordatorios de WhatsApp

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      horas_antes:
        description: "Para pruebas: mandar a citas dentro de estas horas (normal: 4)"
        default: "4"
      simulado:
        description: "Prueba sin plantilla (1 = si)"
        default: "0"

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests tzdata
      - name: Enviar
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          REGISTRO_TURSO_URL: ${{ secrets.REGISTRO_TURSO_URL }}
          REGISTRO_TURSO_TOKEN: ${{ secrets.REGISTRO_TURSO_TOKEN }}
          RECORDATORIO_SIMULADO: ${{ inputs.simulado || '0' }}
          RECORDATORIO_HORAS_ANTES: ${{ inputs.horas_antes || '4' }}
        run: python enviar_recordatorios.py
