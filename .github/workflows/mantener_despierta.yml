# Abre CADA HORA todas las apps listadas en despertar_urls.txt con un navegador real (como si fuera un visitante)
# para que Streamlit Community Cloud nunca la duerma por inactividad. Si la
# encuentra dormida, le da clic a "Yes, get this app back up!".
#
# Ademas evita que GitHub pause esta tarea: GitHub apaga las tareas
# programadas de repos publicos que pasan 60 dias sin actividad, asi que
# cada ~30 dias se manda un commit vacio a la rama "keepalive" (no a main,
# para no reiniciar la app).
#
# Para correrlo a mano: pestana "Actions" del repo > "Mantener la app despierta" > "Run workflow".
name: Mantener la app despierta

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, en el minuto 7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: despertar_urls.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
      - name: Visitar la app
        run: |
          python - <<'PY'
          import os, re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              navegador = p.chromium.launch()
              urls = [l.strip() for l in open("despertar_urls.txt", encoding="utf-8")
                      if l.strip() and not l.strip().startswith("#")]
              for url in urls:
                  pagina = navegador.new_page()
                  try:
                      pagina.goto(url, wait_until="domcontentloaded", timeout=90000)
                  except Exception as e:
                      print(f"{url}: no se pudo abrir ({e})")
                      pagina.close()
                      continue
                  pagina.wait_for_timeout(8000)
                  boton = pagina.get_by_role("button", name=re.compile("get this app back up", re.I))
                  if boton.count():
                      print(f"{url}: estaba dormida, despertandola...")
                      boton.first.click()
                      pagina.wait_for_timeout(90000)
                  else:
                      print(f"{url}: despierta.")
                      pagina.wait_for_timeout(15000)
                  pagina.close()
              navegador.close()
          PY

  no_pausar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Commit vacio a "keepalive" si hace falta
        run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          ultimo=$(git ls-remote origin refs/heads/keepalive | cut -f1)
          if [ -n "$ultimo" ]; then
            git fetch -q --depth=1 origin keepalive
            edad=$(( ( $(date +%s) - $(git log -1 --format=%ct FETCH_HEAD) ) / 86400 ))
          else
            edad=999
          fi
          echo "Dias desde el ultimo keepalive: $edad"
          if [ "$edad" -ge 30 ]; then
            git commit --allow-empty -q -m "keepalive: mantener activas las tareas programadas"
            git push -q -f origin HEAD:refs/heads/keepalive
            echo "Listo, actividad registrada."
          fi
