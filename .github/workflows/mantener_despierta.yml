# Abre la app cada 6 horas con un navegador real (como si fuera un visitante)
# para que Streamlit Community Cloud no la duerma por inactividad. Si la
# encuentra dormida, le da clic a "Yes, get this app back up!".
# Corre gratis en GitHub Actions. Para correrlo a mano: pestana "Actions" del
# repo > "Mantener la app despierta" > "Run workflow".
name: Mantener la app despierta

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas (hora UTC)
  workflow_dispatch:

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://clinicadentalaikasolutions.streamlit.app/?negocio=demo
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visitar la app
        run: |
          python - <<'PY'
          import os, re
          from playwright.sync_api import sync_playwright
          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              navegador = p.chromium.launch()
              pagina = navegador.new_page()
              pagina.goto(url, wait_until="domcontentloaded", timeout=90000)
              pagina.wait_for_timeout(8000)
              boton = pagina.get_by_role("button", name=re.compile("get this app back up", re.I))
              if boton.count():
                  print("La app estaba dormida: despertandola...")
                  boton.first.click()
                  pagina.wait_for_timeout(90000)
              else:
                  print("La app ya estaba despierta.")
                  pagina.wait_for_timeout(20000)
              navegador.close()
          PY
